# torture.yaml — TortureU scenario definition
#
# One flat file (D-1). Four blocks: egress, load, faults, assert.
# Generated by `tortureu init`, edited by humans or agents, compiled to k6 + Toxiproxy.

version: 0

# ─────────────────────────────────────────────────────────────────────────────
# TARGET — what we're torturing. Detected from docker-compose.yml (D-3).
# ─────────────────────────────────────────────────────────────────────────────
target:
  compose: ./docker-compose.yml
  service: checkout-api           # the SUT
  base_url: http://localhost:8080
  openapi: ./openapi.yaml         # optional; enables Schemathesis fuzzing

# ─────────────────────────────────────────────────────────────────────────────
# EGRESS — DC-2: default-deny. Unclassified host => run refuses to start.
# `tortureu init` lists every external host it found; you classify each one.
# Enforced by network topology, not policy checks.
# ─────────────────────────────────────────────────────────────────────────────
egress:
  default: deny
  hosts:
    postgres:5432:        { class: internal }
    redis:6379:           { class: internal }
    api.stripe.com:       { class: mock, from: capture }   # WireMock, replayed capture
    api.twilio.com:       { class: mock, from: spec }      # WireMock, from OpenAPI
    telemetry.vendor.io:  { class: block }                 # dropped silently
    # A host left out of this map is UNCLASSIFIED and aborts the run by name.

    # class: real  requires an explicit rate ceiling. Replay >1x needs --allow-real-traffic.
    # sandbox.partner.com: { class: real, max_rps: 5 }

# ─────────────────────────────────────────────────────────────────────────────
# RESET — D-8: reset by default so verdicts are comparable across commits.
# Skip with --no-reset while iterating.
# ─────────────────────────────────────────────────────────────────────────────
reset:
  command: docker compose down -v && docker compose up -d --wait
  seed: ./scripts/seed.sql        # optional

# ─────────────────────────────────────────────────────────────────────────────
# LOAD — open model (arrival rate), never closed. A closed model hides
# coordinated omission: as the server slows the load slows with it, and the
# spike you think you're testing never happens.
# Phase names are the anchors faults attach to (D-7).
# ─────────────────────────────────────────────────────────────────────────────
load:
  engine: k6
  model: arrival_rate             # requests/sec, independent of response time
  stages:
    - phase: ramp_up
      to: 500rps
      over: 60s
    - phase: peak                 # anchors: peak, peak+30s, ...
      hold: 500rps
      for: 180s
    - phase: spike
      to: 5000rps
      over: 10s                   # the actual spike test
    - phase: recover
      to: 500rps
      over: 30s

  scenarios:
    - name: checkout
      weight: 70
      flow:
        - { method: POST, path: /cart,      body: "@fixtures/cart.json" }
        - { method: POST, path: /checkout,  capture: order_id }
        - { method: GET,  path: "/orders/{{ order_id }}" }
    - name: browse
      weight: 30
      flow:
        - { method: GET,  path: "/products?page={{ randInt(1,50) }}" }

# ─────────────────────────────────────────────────────────────────────────────
# FAULTS — the part nothing else does off-Kubernetes: load and faults on ONE
# clock. Anchored to load phases, not wall-clock (D-7).
# ─────────────────────────────────────────────────────────────────────────────
faults:
  - name: pg_slow
    at: peak                      # phase anchor
    for: 60s
    target: postgres:5432
    inject: { latency: 300ms, jitter: 50ms }     # Toxiproxy

  - name: redis_dies
    at: peak+90s
    for: 30s
    target: redis:6379
    inject: { down: true }                        # connection refused

  # R-CFG-14: one verb per fault. Two effects on one target = two faults sharing an anchor.
  - name: stripe_slow
    at: spike
    for: 40s
    target: api.stripe.com
    inject: { latency: 2s }                       # WireMock fault mode
  - name: stripe_errors
    at: spike
    for: 40s
    target: api.stripe.com
    inject: { error_rate: 0.15, status: 503 }

  - name: cpu_squeeze
    at: spike
    for: 20s
    target: checkout-api
    inject: { cpu: 90%, workers: 4 }              # stress-ng: cpu verb + workers modifier

  - name: pod_pause
    at: t=240s                    # absolute escape hatch
    for: 5s
    target: checkout-api
    inject: { pause: true }       # SIGSTOP — not a crash, a different failure class

# Without OpenTelemetry, prefer ONE fault active at a time: verdicts degrade from
# `caused` to `correlated` (still honest) rather than `ambiguous` (useless). See D-4.

# ─────────────────────────────────────────────────────────────────────────────
# ASSERT — D-2: k6 threshold syntax verbatim, plus a promql escape hatch for
# every signal k6 cannot see.
# ─────────────────────────────────────────────────────────────────────────────
assert:
  - http_req_duration: ["p(95)<500", "p(99)<1500"]
  - http_req_failed:   ["rate<0.01"]

  # retry storms, pool saturation, queue depth — invisible to the load generator
  - promql: 'sum(rate(app_retries_total[30s])) < 100'
  - promql: 'pg_stat_activity_count / pg_settings_max_connections < 0.9'

  # post-run data integrity: did chaos corrupt anything?
  - promql: 'orders_total == payments_total'

# ─────────────────────────────────────────────────────────────────────────────
# FUZZ — runs before load. Cheapest 500-finder there is; near-zero config when
# an OpenAPI spec exists.
# ─────────────────────────────────────────────────────────────────────────────
fuzz:
  engine: schemathesis
  checks: [not_a_server_error, status_code_conformance, response_schema_conformance]
  max_examples: 200
