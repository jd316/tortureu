name: ci
on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.26' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - run: pip install pyyaml
      # Docs, spec and registry must agree — this is the gate that caught a 14-tool
      # miscount, 17 dead predicates and an unparseable example.
      - run: python3 check.py

      # The DC-2 enforcement test and its negative control skip when Docker is absent, which
      # would make the project's central guarantee unproven in CI while still reporting green.
      # Fail loudly instead: on ubuntu-latest Docker is present, so absence means something broke.
      - name: docker must be available (DC-2 evidence depends on it)
        run: docker info > /dev/null

      - run: go vet ./...
      - run: go test ./... -race
      # `gofmt -l | test -s /dev/stdin` silently always passes on a pipe — verified.
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
