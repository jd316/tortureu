name: ci
on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.26' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - run: pip install pyyaml
      # Docs, spec and registry must agree — this is the gate that caught a 14-tool
      # miscount, 17 dead predicates and an unparseable example.
      - run: python3 check.py

      - run: go vet ./...
      - run: go test ./... -race
      # `gofmt -l | test -s /dev/stdin` silently always passes on a pipe — verified.
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
