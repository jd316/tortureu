# Cuts a release when a maintainer pushes a `v*` tag: cross-platform archives
# plus checksums.txt (goreleaser), and the CI job image (SPEC.md TBD-11).
#
# Nothing here runs on a branch push — publishing is a tagging decision.
# goreleaser creates the release as a DRAFT (.goreleaser.yaml), so the URLs
# the generated pipelines point at do not resolve until the maintainer
# publishes it and sets internal/ci.ReleaseVersion to the tag.
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  archives:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # goreleaser reads tags for the changelog
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # Tagged only, never `latest`: R-CLI-11 forbids the generated
          # pipeline from floating, and a floating tag in the registry is the
          # thing that makes floating possible.
          tags: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
