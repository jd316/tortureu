services:
  checkout-api:
    build: ./api
    ports:
      - "8080:8080"
    environment:
      REDPANDA_PROXY: "http://redpanda:8082"

# Redpanda and Prometheus are deliberately NOT compose services here. See
# evals/corpus/case4-nonidempotent-consumer/run.sh's own header comment for
# why: internal/run.ComposeTopologyApplier moves every non-proxy compose
# service exclusively onto the internal:true SUT network (R-DC2-3), and
# nothing published there is reachable from the host once that happens
# (the same defect this eval found for k6 in round 1 -- fixed there, but
# never generalized to internal/applier.BrokerApplier or
# internal/run.HTTPPromQuerier, both of which are plain host processes
# with no "join the SUT's network namespace" equivalent to K6Runner's
# fix). Running them as standalone containers dual-homed onto the SUT
# network (default bridge + tortureu_sut, once it exists) is a test
# harness workaround, not a fix to that gap -- see run.sh and
# evals/results/summary.json's case 4 entry for the full finding.
