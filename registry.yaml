# TortureU tool registry — the "all in one place" surface.
#
# Every tool in the survey, at one of three tiers:
#
#   drive     we execute it, on our clock, folded into one verdict
#   delegate  we generate its config/command and hand off; real output, separate timing
#   know      we name it, say when it applies, point at it
#
# `when:` predicates drive the suggestions `tortureu doctor` prints. They are evaluated against
# describe_system() output (D-3: compose + lockfile only).
#
#   always · dep:<type> · lang:<name> · spec:openapi · spec:proto
#   platform:k8s · platform:aws · has:traffic-capture · lacks:otel
#
# This file is the reason "all in one place" is true: 28 adapters, 151 tools,
# 19 domains, one front door. Editing a tier here changes what `tortureu doctor` reports.
#
# Predicate grammar (unambiguous — the prefix is repeated across alternatives):
#   when: "dep:kafka|dep:sqs"      OK
#   when: "dep:kafka|sqs"          INVALID — bare alternative
# Every predicate must be derivable from compose + lockfile alone (D-3).

version: 0

domains:

  # ───────────────────────────────────────────────────────────── 1
  - id: load
    name: Load generation
    coverage: drive
    tools:
      - { id: k6,        tier: drive,    when: always,        how: "tortureu run <scenario>", note: "default engine; open-model arrival rate" }
      - { id: vegeta,    tier: drive,    when: always,        how: "tortureu smoke",          note: "constant-rate sanity check, no script", planned: smoke }
      - { id: gatling,   tier: delegate, when: "lang:java|lang:scala", how: "tortureu emit gatling", note: "highest throughput per generator", planned: emit }
      - { id: locust,    tier: delegate, when: "lang:python", how: "tortureu emit locust", planned: emit }
      - { id: jmeter,    tier: delegate, when: "dep:jms|dep:ldap|dep:soap", how: "tortureu emit jmeter", note: "only for protocols k6 lacks", planned: emit }
      - { id: artillery, tier: know,     when: never,         how: "npx artillery run",       note: "Lambda/Fargate fan-out if you outgrow one generator" }
      - { id: wrk2,      tier: know,     when: never,         how: "wrk2 -R<rate>",           note: "correct coordinated-omission handling" }
      - { id: oha,       tier: know,     when: never,         how: "oha -q <rate> <url>",     note: "TUI, quick local checks" }
      - { id: bombardier, tier: know,    when: never,         how: "bombardier -r <rate>" }
      - { id: hey,       tier: know,     when: never,         how: "hey -q <rate>" }
      - { id: nbomber,   tier: know,     when: "lang:csharp", how: "dotnet run",              note: ".NET-native load DSL" }
      - { id: tsung,     tier: know,     when: never,         how: "tsung start",             note: "Erlang; massive concurrency, XMPP/AMQP" }
      - { id: loadrunner, tier: know,    when: never,         how: "commercial",              note: "regulated enterprise, protocol breadth" }
      - { id: neoload,   tier: know,     when: never,         how: "commercial" }
      - { id: blazemeter, tier: know,    when: never,         how: "commercial",              note: "managed geo-distributed generators" }

  # ───────────────────────────────────────────────────────────── 2
  - id: protocol_load
    name: Protocol-specific load
    coverage: drive
    tools:
      - { id: k6-grpc,   tier: drive,    when: "spec:proto",  how: "tortureu run",            note: "gRPC via k6 module" }
      - { id: k6-ws,     tier: drive,    when: "dep:websocket", how: "tortureu run",          note: "long-lived conns = fd exhaustion class" }
      - { id: pgbench,   tier: drive,    when: "dep:postgresql", how: "tortureu run --db-load", planned: "run --db-load", note: "saturate the DB independent of the app" }
      - { id: ghz,       tier: delegate, when: "spec:proto",  how: "tortureu emit ghz", planned: emit }
      - { id: sysbench,  tier: delegate, when: "dep:mysql",   how: "tortureu emit sysbench", planned: emit }
      - { id: memtier,   tier: delegate, when: "dep:redis",   how: "tortureu emit memtier",   note: "richer than redis-benchmark", planned: emit }
      - { id: redis-benchmark, tier: know, when: "dep:redis", how: "redis-benchmark -c 50" }
      - { id: xk6-kafka, tier: delegate, when: "dep:kafka",   how: "tortureu emit kafka-load", planned: emit }
      - { id: ycsb,      tier: know,     when: "dep:mongodb|dep:cassandra|dep:dynamodb", how: "ycsb run <db> -P workloads/workloada", note: "standard workloads A-F" }
      - { id: rally,     tier: know,     when: "dep:elasticsearch", how: "esrally race" }
      - { id: hammerdb,  tier: know,     when: "dep:postgresql|dep:mysql|dep:oracle", how: "hammerdbcli", note: "TPC-C/TPC-H style" }
      - { id: emqtt-bench, tier: know,   when: "dep:mqtt",    how: "emqtt_bench pub" }
      - { id: warp,      tier: know,     when: "dep:s3|dep:minio", how: "warp mixed" }
      - { id: iperf3,    tier: know,     when: never,         how: "iperf3 -c <host>",        note: "calibrate the network ceiling before blaming the app" }
      - { id: dnsperf,   tier: know,     when: never,         how: "dnsperf -s <server>" }

  # ───────────────────────────────────────────────────────────── 3
  - id: network_faults
    name: Network fault injection
    coverage: drive
    tools:
      - { id: toxiproxy, tier: drive,    when: always,        how: "faults: [{inject: {latency|down|bandwidth|slicer}}]", note: "CORE. local, scriptable, no k8s" }
      - { id: pumba,     tier: delegate, when: "always",      how: "tortureu emit pumba",     note: "container kill/pause + netem", planned: emit }
      - { id: tc-netem,  tier: delegate, when: always,        how: "tortureu emit netem",     note: "needs NET_ADMIN", planned: emit }
      - { id: iptables,  tier: delegate, when: always,        how: "tortureu emit iptables",  note: "blackhole vs RST are different client behaviours", planned: emit }
      - { id: istio-fault, tier: know,   when: "platform:k8s", how: "VirtualService fault filter", note: "HTTP abort/delay by percentage" }
      - { id: linkerd-fault, tier: know, when: "platform:k8s", how: "linkerd inject" }
      - { id: blockade,  tier: know,     when: never,         how: "blockade partition",      note: "overlaps pumba" }

  # ───────────────────────────────────────────────────────────── 4
  - id: host_faults
    name: Host / resource faults
    coverage: drive
    tools:
      - { id: stress-ng, tier: drive,    when: always,        how: "faults: [{inject: {cpu|mem|io|fd}}]", note: "300+ stressors" }
      - { id: cgroups,   tier: drive,    when: always,        how: "faults: [{inject: {cpu_limit|mem_limit}}]" }
      - { id: signals,   tier: drive,    when: always,        how: "faults: [{inject: {pause|kill|graceful}}]", note: "SIGSTOP vs SIGKILL vs SIGTERM = 3 failure classes" }
      - { id: fio,       tier: delegate, when: "dep:postgresql|dep:mysql|dep:mongodb", how: "tortureu emit fio", note: "fsync latency is where DBs die", planned: emit }
      - { id: libfaketime, tier: delegate, when: always,      how: "tortureu emit clockskew", note: "breaks JWT exp, cache TTL, leader leases", planned: emit }
      - { id: chaosblade, tier: know,    when: "lang:java",   how: "blade create jvm delay",  note: "JVM-level injection is genuinely unique" }
      - { id: charybdefs, tier: know,    when: never,         how: "FUSE mount",              note: "inject IO errors at the filesystem" }
      - { id: libfiu,    tier: know,     when: never,         how: "fiu-run -x",              note: "syscall-level failure injection" }
      - { id: dm-flakey, tier: know,     when: never,         how: "dmsetup create",          note: "block-device IO errors" }

  # ───────────────────────────────────────────────────────────── 5
  - id: platform_chaos
    name: Platform chaos (k8s / cloud)
    coverage: delegate
    tools:
      - { id: chaos-mesh, tier: delegate, when: "platform:k8s", how: "tortureu emit chaosmesh", note: "same torture.yaml -> CRDs. 17 attack types", planned: emit }
      - { id: litmus,    tier: know,     when: "platform:k8s", how: "kubectl apply -f chaosengine.yaml", note: "experiment hub, GameDay workflows" }
      - { id: chaos-toolkit, tier: know, when: "platform:k8s", how: "chaos run experiment.json", note: "vendor-neutral driver model; possible escape hatch" }
      - { id: aws-fis,   tier: know,     when: "platform:aws", how: "aws fis start-experiment", note: "spot interruption / AZ failure are unsimulatable locally" }
      - { id: azure-chaos, tier: know,   when: "platform:azure", how: "az chaos experiment start" }
      - { id: kube-monkey, tier: know,   when: never,         how: "helm install kube-monkey", note: "random pod kill = 1 line of chaos-mesh" }
      - { id: powerfulseal, tier: know,  when: never,         how: "seal interactive" }
      - { id: gremlin,   tier: know,     when: never,         how: "commercial",              note: "blast-radius controls + audit; buy for prod chaos" }
      - { id: steadybit, tier: know,     when: never,         how: "commercial",              note: "first chaos MCP; Kafka extension worth reading" }
      - { id: chaoseater, tier: know,    when: never,         how: "research",                note: "NTT: LLM runs the full chaos cycle over k8s. closest prior art to our loop" }

  # ───────────────────────────────────────────────────────────── 6
  - id: capture_replay
    name: Traffic capture & replay
    coverage: delegate
    tools:
      - { id: goreplay,  tier: delegate, when: "has:traffic-capture", how: "tortureu replay --from <pcap>", note: "replay 1x-100x. DC-2 rate ceiling applies", planned: replay }
      - { id: keploy,    tier: delegate, when: always,        how: "tortureu capture --engine keploy", note: "eBPF -> tests + auto-mocks. integrate, never reimplement", planned: capture }
      - { id: mitmproxy, tier: know,     when: never,         how: "mitmdump -w out.flows",   note: "interactive capture + scriptable rewrite" }
      - { id: vcr,       tier: know,     when: always,        how: "language-specific",       note: "cassettes belong in the app's own suite" }
      - { id: envoy-mirror, tier: know,  when: "platform:k8s", how: "request_mirror_policy" }
      - { id: diffy,     tier: know,     when: never,         how: "docker run diffy",        note: "old-vs-new response diffing" }
      - { id: speedscale, tier: know,    when: never,         how: "commercial",              note: "eBPF capture + transforms + auto-mocks" }
      - { id: tcpreplay, tier: know,     when: never,         how: "tcpreplay -i eth0",       note: "raw pcap, too low-level for app backends" }

  # ───────────────────────────────────────────────────────────── 7
  - id: correctness
    name: Correctness under chaos
    coverage: know
    note: >
      Document-and-defer as a domain. These need deep per-system integration; a generic
      CLI cannot deliver them. Porcupine is the one exception — it consumes a history,
      which we already hold.
    tools:
      - { id: porcupine, tier: delegate, when: "dep:etcd|dep:consul|dep:zookeeper", how: "tortureu emit porcupine", note: "linearizability check over our own request history", planned: emit }
      - { id: jepsen,    tier: know,     when: "dep:etcd|dep:cassandra|dep:kafka|dep:cockroach", how: "lein run test", note: "gold standard. Clojure, bespoke harness, days per run" }
      - { id: antithesis, tier: know,    when: never,         how: "commercial",              note: "deterministic hypervisor over your whole compose stack. the aspirational ceiling" }
      - { id: madsim,    tier: know,     when: "lang:rust",   how: "cargo test",              note: "deterministic async runtime, in-process" }
      - { id: tla-plus,  tier: know,     when: never,         how: "tlc spec.tla",            note: "design-time; catches what no runtime test can" }
      - { id: maelstrom, tier: know,     when: never,         how: "maelstrom test",          note: "workbench for your own distributed toy" }
      - { id: elle,      tier: know,     when: never,         how: "via jepsen",              note: "transactional anomaly detection" }

  # ───────────────────────────────────────────────────────────── 8
  - id: fuzzing
    name: API fuzzing / property testing
    coverage: drive
    tools:
      - { id: schemathesis, tier: drive, when: "spec:openapi", how: "tortureu run --fuzz",    planned: "run --fuzz", note: "cheapest 500-finder that exists" }
      - { id: restler,   tier: delegate, when: "spec:openapi", how: "tortureu emit restler",  note: "stateful: infers request SEQUENCES", planned: emit }
      - { id: dredd,     tier: know,     when: "spec:openapi", how: "dredd api.yaml <url>",   note: "overlaps schemathesis" }
      - { id: hypothesis, tier: know,    when: "lang:python", how: "in-process",              note: "property testing belongs in the app's suite" }
      - { id: go-fuzz,   tier: know,     when: "lang:go",     how: "go test -fuzz" }
      - { id: afl,       tier: know,     when: never,         how: "afl-fuzz",                note: "binary coverage-guided; app's own CI" }
      - { id: boofuzz,   tier: know,     when: never,         how: "python fuzz.py",          note: "protocol fuzzing, security-team tool" }

  # ───────────────────────────────────────────────────────────── 9
  - id: dep_virtualization
    name: Dependency virtualization
    coverage: drive
    note: "DC-2 safety requirement, not a feature. Unclassified egress aborts the run."
    tools:
      - { id: wiremock,  tier: drive,    when: always,        how: "egress: {class: mock}",   note: "stub + fault + delay + proxy-record" }
      - { id: keploy-mocks, tier: delegate, when: "has:traffic-capture", how: "egress: {from: capture}", note: "auto-derived beats hand-written" }
      - { id: hoverfly,  tier: delegate, when: always,        how: "tortureu emit hoverfly",  note: "single Go binary, lighter than wiremock", planned: emit }
      - { id: localstack, tier: delegate, when: "dep:aws",    how: "tortureu emit localstack", note: "AWS emulation with failure injection", planned: emit }
      - { id: mountebank, tier: know,    when: "dep:smtp|dep:jms", how: "mb --configfile",        note: "multi-protocol imposters" }
      - { id: prism,     tier: know,     when: "spec:openapi", how: "prism mock api.yaml",    note: "wiremock+spec covers it" }
      - { id: mockserver, tier: know,    when: never,         how: "docker run mockserver" }

  # ───────────────────────────────────────────────────────────── 10
  - id: environments
    name: Environment provisioning
    coverage: drive
    tools:
      - { id: docker-compose, tier: drive, when: always,      how: "target.compose",          note: "detection substrate AND DC-2 enforcement point" }
      - { id: testcontainers, tier: delegate, when: always,   how: "tortureu emit testcontainers", note: "library not CLI; we emit helpers", planned: emit }
      - { id: kind,      tier: delegate, when: "platform:k8s", how: "tortureu emit kind", planned: emit }
      - { id: k3d,       tier: know,     when: "platform:k8s", how: "k3d cluster create" }
      - { id: nix,       tier: know,     when: never,         how: "nix develop",             note: "toolchain reproducibility, orthogonal" }
      - { id: vcluster,  tier: know,     when: "platform:k8s", how: "vcluster create",        note: "ephemeral preview envs" }

  # ───────────────────────────────────────────────────────────── 11
  - id: observability
    name: Observability & measurement
    coverage: drive
    note: "Verdict quality is capped here. No OTel => max confidence `correlated` (D-4)."
    tools:
      - { id: prometheus, tier: drive,   when: always,        how: "assert: [{promql: ...}]", note: "k6 writes here, verdict reads here" }
      - { id: opentelemetry, tier: drive, when: always,       how: "auto-detected",           note: "THE correlation key. `caused` confidence needs it" }
      - { id: grafana,   tier: delegate, when: always,        how: "tortureu emit dashboard", note: "canned dashboard per scenario", planned: emit }
      - { id: pyroscope, tier: delegate, when: always,        how: "tortureu emit pyroscope", note: "flamegraph diffed across the fault window = root cause free", planned: emit }
      - { id: jaeger,    tier: delegate, when: "lacks:otel",  how: "tortureu emit jaeger", planned: emit }
      - { id: loki,      tier: know,     when: always,        how: "docker run loki",         note: "retry-storm detection" }
      - { id: pprof,     tier: know,     when: "lang:go",     how: "go tool pprof" }
      - { id: async-profiler, tier: know, when: "lang:java",  how: "./profiler.sh -d 30" }
      - { id: py-spy,    tier: know,     when: "lang:python", how: "py-spy record" }
      - { id: bpftrace,  tier: know,     when: never,         how: "bpftrace -e",             note: "when the app-level story doesn't add up" }
      - { id: pixie,     tier: know,     when: "platform:k8s|lacks:otel", how: "px deploy",   note: "eBPF auto-instrumentation, zero code" }

  # ───────────────────────────────────────────────────────────── 12
  - id: gating
    name: SLO gating & regression
    coverage: drive
    tools:
      - { id: k6-thresholds, tier: drive, when: always,       how: "assert: [http_req_duration: [...]]", note: "D-2: our assertion language, verbatim" }
      - { id: promql,    tier: drive,    when: always,        how: "assert: [{promql: ...}]", note: "everything k6 cannot see" }
      - { id: bencher,   tier: delegate, when: always,        how: "tortureu emit bencher",   note: "turns one-shot runs into a trend", planned: emit }
      - { id: openslo,   tier: know,     when: never,         how: "openslo validate",        note: "rejected for v0 (D-2): built for burn-rate, not run-scoped" }
      - { id: sloth,     tier: know,     when: "platform:k8s", how: "sloth generate" }
      - { id: hyperfine, tier: know,     when: never,         how: "hyperfine '<cmd>'",       note: "statistically sound CLI benchmarking" }

  # ───────────────────────────────────────────────────────────── 13
  - id: data
    name: Data, fixtures & post-chaos integrity
    coverage: delegate
    note: >
      "Did chaos corrupt anything?" is the highest-value question nobody asks. Note the
      research finding: GE/Soda/dbt are PIPELINE quality tools, not chaos verifiers.
      For run-scoped invariants, a SQL check or a promql assertion is the honest answer.
    tools:
      - { id: sql-invariants, tier: drive, when: "dep:postgresql|dep:mysql", how: "assert: [{sql: 'select count(*) ...'}]", note: "run-scoped integrity. simplest thing that works" }
      - { id: soda-core, tier: delegate, when: "dep:postgresql|dep:mysql|dep:snowflake", how: "tortureu emit soda", note: "YAML-first checks, lighter than GE", planned: emit }
      - { id: seeds,     tier: drive,    when: always,        how: "reset.seed",              note: "D-8: deterministic start state" }
      - { id: gofakeit,  tier: delegate, when: "lang:go",     how: "tortureu emit fixtures", planned: emit }
      - { id: faker,     tier: delegate, when: "lang:python|lang:js", how: "tortureu emit fixtures", planned: emit }
      - { id: great-expectations, tier: know, when: never,    how: "great_expectations checkpoint run", note: "pipeline-oriented; heavy for run-scoped checks" }
      - { id: dbt-tests, tier: know,     when: never,         how: "dbt test",                note: "warehouse-native, wrong layer for us" }
      - { id: neosync,   tier: know,     when: never,         how: "neosync sync",            note: "prod subsetting + anonymization; compliance-gated" }
      - { id: snaplet,   tier: know,     when: never,         how: "snaplet snapshot create" }

  # ───────────────────────────────────────────────────────────── 14
  - id: contracts
    name: Contract & compatibility
    coverage: delegate
    tools:
      - { id: oasdiff,   tier: delegate, when: "spec:openapi", how: "tortureu check contracts", note: "cheap, high signal, seconds to run", planned: check }
      - { id: buf-breaking, tier: delegate, when: "spec:proto", how: "tortureu check contracts", note: "protobuf compat; mechanical", planned: check }
      - { id: pact,      tier: know,     when: "spec:openapi|spec:proto", how: "pact-broker can-i-deploy", note: "most-adopted CDC tool, but a whole workflow of its own" }
      - { id: spring-cloud-contract, tier: know, when: "lang:java", how: "mvn verify" }

  # ───────────────────────────────────────────────────────────── 15
  - id: security
    name: Security under load
    coverage: know
    note: "Separate product. Wrapping ZAP makes us a worse ZAP. Exception: slowhttptest is a load concern."
    tools:
      - { id: slowhttptest, tier: delegate, when: always,     how: "tortureu emit slowloris", note: "slow-read/slow-post resource exhaustion IS a load failure mode", planned: emit }
      - { id: zap,       tier: know,     when: "spec:openapi", how: "zap-api-scan.py -t api.yaml", note: "full DAST, its own CI job" }
      - { id: nuclei,    tier: know,     when: always,        how: "nuclei -u <url>" }
      - { id: semgrep,   tier: know,     when: always,        how: "semgrep --config auto",   note: "could seed our fault matrix by finding missing timeouts" }
      - { id: sqlmap,    tier: know,     when: never,         how: "sqlmap -u <url>",         note: "pentest tool, not a dev toolkit component" }

  # ───────────────────────────────────────────────────────────── 16
  - id: orchestration
    name: Orchestration & CI
    coverage: drive
    tools:
      - { id: github-actions, tier: drive, when: always,      how: "tortureu init --ci",      planned: "init --ci", note: "exit codes 0-4 are the contract (VERDICT.md §2)" }
      - { id: gitlab-ci, tier: delegate, when: always,        how: "tortureu init --ci gitlab", planned: "init --ci" }
      - { id: testkube,  tier: know,     when: "platform:k8s", how: "testkube run",           note: "closest structural competitor; cluster-only. our wedge is local-first" }
      - { id: argo-workflows, tier: know, when: "platform:k8s", how: "argo submit" }

  # ───────────────────────────────────────────────────────────── 17
  - id: agent_surfaces
    name: Agent surfaces (prior art)
    coverage: compose
    note: "DC-1 noun rule. We own experiment/fault/slo/verdict. Vendors own their primitives."
    tools:
      - { id: tortureu-mcp, tier: drive, when: always,        how: "tortureu mcp",            note: "lists the five tools (describe_system, propose_experiments, run_experiment, explain_failure, emit_k6_script); no stdio transport yet" }
      - { id: k6-x-agent, tier: know,    when: always,        how: "k6 x agent",              note: "coexists. disjoint nouns. escape hatch after emit_k6_script" }
      - { id: grafana-mcp, tier: know,   when: always,        how: "grafana mcp",             note: "query metrics/logs/traces conversationally" }
      - { id: steadybit-mcp, tier: know, when: never,         how: "commercial" }
      - { id: chaos-mesh-mcp, tier: know, when: "platform:k8s", how: "community MCP" }

  # ───────────────────────────────────────────────────────────── 18  (NEW — see RESEARCH.md §18)
  - id: async
    name: Event-driven / async torture
    coverage: drive
    note: >
      Found in R&D round 2. Was wrongly buried inside "protocol load". Async backends fail
      in ways synchronous load tests cannot express: poison pills, rebalance storms, duplicate
      delivery, DLQ overflow, unbounded consumer lag. Toxiproxy already sits in front of a
      broker, so most of this is scenario vocabulary, not new machinery.
    tools:
      - { id: broker-faults, tier: drive, when: "dep:kafka|dep:rabbitmq|dep:nats|dep:sqs", how: "faults: [{target: kafka, inject: {down|latency|partition}}]", note: "Toxiproxy in front of the broker" }
      - { id: poison-pill, tier: drive,  when: "dep:kafka|dep:rabbitmq", how: "faults: [{inject: {poison_pill: <payload>}}]", note: "one malformed message can block a whole partition" }
      - { id: duplicate-delivery, tier: drive, when: "dep:kafka|dep:sqs", how: "faults: [{inject: {duplicate: 0.05}}]", note: "tests idempotency for real, not by inspection" }
      - { id: consumer-lag, tier: drive, when: "dep:kafka",   how: "assert: [{promql: 'kafka_consumergroup_lag < 10000'}]", note: "the async equivalent of p99" }
      - { id: rebalance-storm, tier: delegate, when: "dep:kafka", how: "tortureu emit rebalance", note: "kill consumers mid-batch, repeatedly", planned: emit }
      - { id: dlq-overflow, tier: delegate, when: "dep:kafka|dep:sqs", how: "tortureu emit dlq-test", note: "what happens when the DLQ itself fills", planned: emit }
      - { id: kafka-perf,  tier: know,   when: "dep:kafka",   how: "kafka-producer-perf-test.sh" }
      - { id: conduktor,   tier: know,   when: "dep:kafka",   how: "commercial",              note: "Kafka chaos + observability" }

  # ───────────────────────────────────────────────────────────── 19  (NEW — see RESEARCH.md §19)
  - id: resilience_config
    name: Resilience configuration audit
    coverage: drive
    note: >
      Round-2 finding: NO linter exists for resilience antipatterns. But we already detect
      client libraries from the lockfile (D-3) and already know their knobs (D-9 candidates).
      Checking "is a timeout actually set" is then nearly free, and it is the single highest-yield
      static check for backends. Static hints; the run proves them.
    tools:
      - { id: timeout-audit, tier: drive, when: always,       how: "tortureu doctor",         note: "flag clients constructed with no timeout — retries+breakers are useless without one" }
      - { id: retry-audit,  tier: drive, when: always,        how: "tortureu doctor",         note: "flag retries with no cap/backoff/jitter — that IS the overload source" }
      - { id: idempotency-audit, tier: drive, when: "dep:kafka|dep:sqs", how: "tortureu doctor", note: "flag retried non-idempotent ops (duplicate charges)" }
      - { id: breaker-audit, tier: drive, when: always,       how: "tortureu doctor",         note: "flag deps with no breaker on the cascade path" }
      - { id: resilience4j, tier: know,  when: "lang:java",   how: "library",                 note: "the fix, not the finding" }
      - { id: cockatiel,   tier: know,   when: "lang:js",     how: "library",                 note: "all four patterns, TS-native" }
      - { id: backoff,     tier: know,   when: "lang:go",     how: "library" }
      - { id: tenacity,    tier: know,   when: "lang:python", how: "library" }
